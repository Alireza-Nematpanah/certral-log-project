
server {
    listen 80;
    server_name localhost;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /error {
        return 500;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
